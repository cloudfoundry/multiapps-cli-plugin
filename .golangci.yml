version: "2"

# golangci-lint configuration for multiapps-cli-plugin
# Runs a standard set of Go linters; JSON output is uploaded to SonarCloud.
run:
  timeout: 5m

linters:
  exclusions:
    paths:
      - test_resources
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
